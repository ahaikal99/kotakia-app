services:
  receipt-worker:
    profiles: ["mail"]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    command: php artisan queue:work database --queue=receipts --sleep=3 --tries=5 --timeout=45
    restart: unless-stopped
    depends_on:
      - db
  # Pelayan Web (Nginx)
  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Aplikasi Laravel (PHP & Node.js untuk Tailwind)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173" # Port khas untuk Laravel Vite (Tailwind HMR)
    depends_on:
      - db

  # Pangkalan Data (MariaDB)
  db:
    image: mariadb:10.11
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kotakia
      MYSQL_USER: kotakia
      MYSQL_PASSWORD: 12321kotakia
    volumes:
      - dbdata:/var/lib/mysql

  # Pengurusan Database (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  dbdata:
